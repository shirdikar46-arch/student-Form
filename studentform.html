
<html>
<head>
    <title>Student Activity Management Portal</title>
</head>
<body>
            <h2>Student Registration Form</h2>
            <form>

                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name">
                    <br><br>

                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email">
                    <br><br>

                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone">
                    <br><br>

                    <label for="roll">University ID Number:</label><br>
                    <input type="text" id="roll" name="roll">
                    <br><br>
                </fieldset>
                <fieldset>
                    <p>Select Gender:</p>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                    <br><br>

                    <p>Select Your Interests:</p>

                    <input type="checkbox" id="coding" name="interest" value="Coding">
                    <label for="coding">Coding</label><br>

                    <input type="checkbox" id="sports" name="interest" value="Sports">
                    <label for="sports">Sports</label><br>

                    <input type="checkbox" id="music" name="interest" value="Music">
                    <label for="music">Music</label><br>

                    <input type="checkbox" id="dance" name="interest" value="Dance">
                    <label for="dance">Dance</label><br><br>

                    <label for="message">Why do you want to participate?</label><br>
                    <textarea id="message" name="message"></textarea>
                    <br><br>
                </fieldset>
            </form>
        </section>
</body>
</html>
